name: Build OPA Client

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build OPA CLIENT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build JAR and release ZIP
        run: gradle --no-daemon clean build

      - name: Upload OPA CLIENT package
        uses: actions/upload-artifact@v4
        with:
          name: OPA-CLIENT-Minecraft-1.21.11
          path: |
            build/libs/*.jar
            build/distributions/*.zip
          if-no-files-found: error
