name: Build OPA Client

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build remapped Fabric mod
        run: gradle --no-daemon clean build
      - name: Upload JAR and install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OPA-CLIENT-Minecraft-1.21.11
          path: |
            build/libs/opa-client-0.1.0.jar
            build/distributions/*.zip
          if-no-files-found: error
          retention-days: 30
