
name: OPA CLIENT Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build OPA CLIENT
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21 installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 9.2.1 installieren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Gradle-Version prüfen
        run: gradle --version

      - name: Client bauen
        run: gradle --no-daemon clean build

      - name: JAR hochladen
        uses: actions/upload-artifact@v4
        with:
          name: OPA-CLIENT-Minecraft-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
